      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminWashingPoint" } }
      required: [items]

    AdminStats:
      type: object
      properties:
        points_total: { type: integer, minimum: 0 }
        points_active: { type: integer, minimum: 0 }
        bookings_today: { type: integer, minimum: 0 }
        canceled_today: { type: integer, minimum: 0 }
        average_utilization: { type: number, format: double, minimum: 0 }
      required: [points_total, points_active, bookings_today, canceled_today, average_utilization]

    Photo:
      type: object
      properties:
        id: { type: string, format: uuid }
