    OwnerCreate:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        contact_name: { type: string, maxLength: 255 }
        contact_phone: { type: string, maxLength: 32 }
        contact_email: { type: string, maxLength: 255 }
      required: [name]

    OwnerUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        contact_name: { type: string, maxLength: 255 }
        contact_phone: { type: string, maxLength: 32 }
        contact_email: { type: string, maxLength: 255 }

    ConnectionRequest:
