        id: { type: string, format: uuid }
        business_name: { type: string }
        contact_name: { type: string }
        contact_phone: { type: string }
        address: { type: string }
        boxes_count: { type: integer, minimum: 1 }
        note: { type: string, nullable: true }
        status: { type: string, enum: [new, approved, rejected] }
        reviewed_by: { type: string, format: uuid, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
      required: [id, business_name, contact_name, contact_phone, address, boxes_count, status, created_at]

    ConnectionRequestList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ConnectionRequest" } }
      required: [items]

    ConnectionRequestCreate:
      type: object
      properties:
        business_name: { type: string, maxLength: 255 }
        contact_name: { type: string, maxLength: 255 }
        contact_phone: { type: string, maxLength: 32 }
        address: { type: string, maxLength: 500 }
