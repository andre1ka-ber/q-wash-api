        break_end: { type: string, nullable: true, example: "14:00" }
      required: [weekday, is_open]

    ScheduleList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ScheduleRow" }, minItems: 7, maxItems: 7 }
      required: [items]

    ScheduleReplace:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ScheduleRow" }, minItems: 7, maxItems: 7 }
      required: [items]

    Box:
      type: object
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, minimum: 1 }
