    QrCodeStats:
      type: object
      properties:
        scans_today: { type: integer }
        scans_7d: { type: integer }
        scans_by_day:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              count: { type: integer }
        bookings_via_qr:
          type: integer
          description: Best-effort heuristic, not exact attribution. 0 for an unassigned code.
      required: [scans_today, scans_7d, scans_by_day, bookings_via_qr]

    QrCode:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: "Human-facing sticker number, e.g. QW-0031, derived from seq." }
        token: { type: string }
        status: { type: string, enum: [free, assigned, disabled] }
        batch_label: { type: string }
        washing_point_id: { type: string, format: uuid, nullable: true }
        washing_point_name: { type: string, nullable: true }
        assigned_at: { type: string, format: date-time, nullable: true }
        disabled_at: { type: string, format: date-time, nullable: true }
        replacement_requested_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        stats: { $ref: "#/components/schemas/QrCodeStats" }
      required: [id, code, token, status, batch_label, created_at]

    QrCodeList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/QrCode" } }
      required: [items]

    QrCodePoolStats:
      type: object
      properties:
        total: { type: integer }
        free: { type: integer }
        assigned: { type: integer }
        disabled: { type: integer }
      required: [total, free, assigned, disabled]

    QrCodePoolList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/QrCode" } }
        stats: { $ref: "#/components/schemas/QrCodePoolStats" }
      required: [items, stats]

    QrCodeGenerate:
      type: object
      properties:
