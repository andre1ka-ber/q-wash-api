services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pegasus
      POSTGRES_PASSWORD: pegasus
      POSTGRES_DB: pegasus
    ports:
      - "5432:5432"
    volumes:
      - pegasus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pegasus -d pegasus"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pegasus_postgres_data:
